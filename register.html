<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration | FaceCare AI</title>

    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="container">

        <div class="form-header">
            <h1>FaceCare AI</h1>
            <h2>Patient Registration</h2>
            <p>Register your details to create a patient profile</p>
        </div>

        <form action="#" method="POST">

            <h3>Personal Information</h3>

            <div class="form-row">
                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter patient name" required>
                </div>

                <div class="input-box">
                    <label>Father Name</label>
                    <input type="text" placeholder="Enter father name">
                </div>
            </div>

            <div class="form-row">
                <div class="input-box">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

                <div class="input-box">
                    <label>Gender</label>
                    <select required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="input-box">
                    <label>CNIC Number</label>
                    <input type="text" placeholder="XXXXX-XXXXXXX-X">
                </div>

                <div class="input-box">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="03XXXXXXXXX" required>
                </div>
            </div>

            <div class="input-box">
                <label>Address</label>
                <textarea placeholder="Enter complete address"></textarea>
            </div>

            <h3>Medical Information</h3>

            <div class="form-row">
                <div class="input-box">
                    <label>Blood Group</label>
                    <select>
                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="input-box">
                    <label>Known Disease</label>
                    <input type="text" placeholder="Enter disease (if any)">
                </div>
            </div>

            <div class="input-box">
                <label>Medical History</label>
                <textarea placeholder="Enter patient medical history"></textarea>
            </div>

            <div class="input-box">
                <label>Doctor Name</label>
                <input type="text" placeholder="Enter doctor name">
            </div>

            <h3>Face Recognition Information</h3>

            <div class="input-box">
                <label>Upload Patient Photo</label>
                <input type="file" accept="image/*" required>
                <small>Upload a clear front-facing patient photograph.</small>
            </div>

            <div class="input-box">
                <label>Registration Date</label>
                <input type="date" required>
            </div>

            <button type="submit">Register Patient</button>

            <p class="login-link">
                Already registered?
                <a href="dashboard.html">Go to Dashboard</a>
            </p>

        </form>
    </div>

</body>
</html>
